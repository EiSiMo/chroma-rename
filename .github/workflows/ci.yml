name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Weekly, so a Claude Code release that breaks the plugin shows up even without a push.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  quality-check:
    name: Typecheck, lint, format & test
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

  plugin-check:
    name: Validate & test against Claude Code
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Latest on purpose: the hooks API is early access, so this job is the early warning
      # that a Claude Code release changed something the plugin relies on.
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code

      - name: Validate plugin and marketplace
        run: npm run validate

      - name: Engine tests
        run: claude plugin test plugin
